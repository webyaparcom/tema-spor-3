<section class="modulex-kayan-perde{{fbsinif}}" {{fbetiket}}>
  <div class="modulex-kayan-perde-ic">
    {{fbbas}}
    {{fbgovde}}

<style>
  /* kayan-perde — Görsel arka plan değil, ayrı sütun — metin her zaman düz zeminde okunur; geçiş yatay kaydırma ya da solma değil, dikey perde (yön dilden bağımsız). */
  .modulex-kayan-perde { box-sizing: border-box; width: 100%; padding: --bosluk-- 20px; background: --bg--; color: --text--; font-size: 1rem; line-height: 1.6; font-family: var(--mx-font-sans, inherit); overflow-wrap: break-word; }
  .modulex-kayan-perde *, .modulex-kayan-perde *::before, .modulex-kayan-perde *::after { box-sizing: border-box; }
  /* ham/css.css «* { font-size: 14px }» kalıtımı keser — modül içinde boyut üstten gelsin (ikon yazı tipi hariç) */
  .modulex-kayan-perde :where(*:not(.material-symbols-outlined)) { font-size: inherit; }
  /* aynı «*» kuralı font-weight 400 · line-height 1.2 · font-family de basar — modül içinde kalıtım */
  .modulex-kayan-perde :where(*:not(.material-symbols-outlined)) { font-weight: inherit; line-height: inherit; font-family: inherit; }
  .modulex-kayan-perde :where(h2, h3, h4, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; }
  .modulex-kayan-perde :where(ul, ol) { padding: 0; list-style: none; }
  .modulex-kayan-perde img { display: block; max-width: 100%; }
  /* <img width height> öznitelik yüksekliği CSS aspect-ratio'yu ezer — sıfır özgüllükle auto (modül sınıfının height'ı yine kazanır) */
  :where(.modulex-kayan-perde) img { height: auto; }
  .modulex-kayan-perde [hidden] { display: none !important; }
  .modulex-kayan-perde :where(a, button, summary, [data-cevir]) { cursor: pointer; }
  .modulex-kayan-perde :where(a, button, summary, [tabindex]):focus-visible { outline: 3px solid --accent--; outline-offset: 3px; }
  .modulex-kayan-perde-ic { max-width: --max--; margin-inline: auto; }
  .modulex-kayan-perde-bas { display: grid; gap: 12px; margin-block-end: clamp(32px, 4vw, 52px); }
  .modulex-kayan-perde--bassiz .modulex-kayan-perde-bas { display: none; }
  .modulex-kayan-perde-ust { color: --accentInk--; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
  .modulex-kayan-perde-baslik { font-family: var(--mx-font-heading, inherit); font-size: clamp(1.8rem, 3.4vw, 2.8rem); font-weight: 750; letter-spacing: -0.025em; line-height: 1.1; }
  .modulex-kayan-perde-metin { color: --muted--; font-size: 1.05rem; line-height: 1.7; }
  .modulex-kayan-perde-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-block-start: 8px; }
  .modulex-kayan-perde-dugme { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 12px 22px; border: 2px solid --accent--; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease; }
  .modulex-kayan-perde-dugme:hover { transform: translateY(-2px); }
  .modulex-kayan-perde-dugme--ikincil { background: transparent; color: --text--; border-color: --cizgi--; }
  .modulex-kayan-perde-dugme--ikincil:hover { border-color: --accent--; }
  .modulex-kayan-perde-dugme .material-symbols-outlined { font-size: 20px; }

  .modulex-kayan-perde { position: relative; }
  /* tam genişlik: taban «.modulex-kayan-perde { padding }» ve 768px «padding-inline: 16px» kuralları sonra gelir → çift sınıfla sıfırla */
  .modulex-kayan-perde.modulex-kayan-perde { padding: 0; }
  .modulex-kayan-perde-karusel { position: relative; outline: none; }
  .modulex-kayan-perde-karusel:focus-visible { outline: 3px solid --accent--; outline-offset: -3px; }
  .modulex-kayan-perde-durum { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .modulex-kayan-perde-sust { color: inherit; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; opacity: 0.92; }
  .modulex-kayan-perde-sbaslik { font-family: var(--mx-font-heading, inherit); font-size: clamp(1.9rem, 4.4vw, 3.6rem); font-weight: 780; letter-spacing: -0.03em; line-height: 1.05; }
  .modulex-kayan-perde-smetin { font-size: clamp(1rem, 1.4vw, 1.15rem); line-height: 1.65; }
  .modulex-kayan-perde-scta { display: inline-flex; align-items: center; gap: 8px; justify-self: start; min-height: 48px; padding: 12px 22px; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; transition: transform 0.25s ease, box-shadow 0.25s ease; }
  .modulex-kayan-perde-scta:hover { transform: translateY(-2px); box-shadow: 0 14px 26px -16px --accent--; }
  .modulex-kayan-perde-scta .material-symbols-outlined { font-size: 20px; }
  .modulex-kayan-perde-gorsel { width: 100%; height: 100%; object-fit: cover; }
  .modulex-kayan-perde-yer { background: linear-gradient(135deg, color-mix(in srgb, --accent-- 55%, --text--), color-mix(in srgb, --accent-- 20%, --text--)); }
  .modulex-kayan-perde-ok, .modulex-kayan-perde-oynat { display: inline-grid; place-items: center; width: 48px; height: 48px; padding: 0; border: 1px solid --cizgi--; border-radius: 50%; background: --bg--; color: --text--; transition: background 0.2s ease, color 0.2s ease, transform 0.2s ease; }
  .modulex-kayan-perde-ok:hover, .modulex-kayan-perde-oynat:hover { background: --accent--; color: --accentText--; border-color: --accent--; }
  .modulex-kayan-perde-ok:active { transform: scale(0.94); }
  .modulex-kayan-perde-nokta { padding: 0; border: 0; background: transparent; color: inherit; font: inherit; }
  .modulex-kayan-perde-karusel--tek :is(.modulex-kayan-perde-ok, .modulex-kayan-perde-oynat, .modulex-kayan-perde-nokta, .modulex-kayan-perde-denetim, .modulex-kayan-perde-sekmeler, .modulex-kayan-perde-kucukler) { display: none; }

  .modulex-kayan-perde-izgara { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); min-height: clamp(420px, var(--kayan-yk), 100vh); }
  .modulex-kayan-perde-yazilar { display: grid; grid-template-rows: minmax(0, 1fr) auto; align-content: center; padding: clamp(36px, 6vw, 88px) clamp(20px, 5vw, 72px); background: --bg--; color: --text--; }
  .modulex-kayan-perde-yazi { grid-area: 1 / 1; display: grid; align-content: center; gap: 16px; max-width: 560px; opacity: 0; visibility: hidden; transform: translateY(16px); transition: opacity 0.5s ease, transform 0.5s ease, visibility 0s linear 0.5s; }
  .modulex-kayan-perde-slayt--aktif.modulex-kayan-perde-yazi { opacity: 1; visibility: visible; transform: none; transition: opacity 0.6s ease 0.15s, transform 0.6s ease 0.15s, visibility 0s; }
  .modulex-kayan-perde-sayac { color: --muted--; font-size: 0.95rem; font-weight: 700; letter-spacing: 0.08em; font-variant-numeric: tabular-nums; }
  .modulex-kayan-perde-sayac span { color: --accentInk--; font-size: clamp(2.6rem, 5vw, 4rem); font-weight: 800; letter-spacing: -0.04em; line-height: 1; }
  .modulex-kayan-perde-sust { color: --accentInk--; opacity: 1; }
  .modulex-kayan-perde-smetin { color: --muted--; }
  .modulex-kayan-perde-denetim { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-block-start: clamp(24px, 4vw, 44px); }
  .modulex-kayan-perde-noktalar { display: flex; flex: 1; gap: 6px; min-width: 80px; }
  .modulex-kayan-perde-nokta { flex: 1; max-width: 56px; height: 24px; }
  .modulex-kayan-perde-nokta::before { content: ""; display: block; height: 3px; border-radius: 3px; background: --cizgi--; transition: background 0.3s ease; }
  .modulex-kayan-perde-nokta:hover::before { background: --muted--; }
  .modulex-kayan-perde-nokta--aktif::before { background: --accent--; }
  .modulex-kayan-perde-gorseller { position: relative; overflow: hidden; background: --kartBg--; }
  .modulex-kayan-perde-gkat { position: absolute; inset: 0; clip-path: inset(0 0 100% 0); transition: clip-path 0.9s cubic-bezier(0.7, 0, 0.2, 1); }
  .modulex-kayan-perde-gkat--aktif { z-index: 1; clip-path: inset(0 0 0 0); }
  .modulex-kayan-perde-gkat .modulex-kayan-perde-gorsel { transform: scale(1.08); transition: transform 1.6s ease; }
  .modulex-kayan-perde-gkat--aktif .modulex-kayan-perde-gorsel { transform: none; }
  @media (max-width: 1024px) {
    .modulex-kayan-perde-izgara { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(260px, 46vh) auto; min-height: 0; }
    .modulex-kayan-perde-gorseller { grid-row: 1; }
    .modulex-kayan-perde-yazilar { padding: 32px 20px 36px; }
  }
  @media (max-width: 768px) {
    .modulex-kayan-perde-yazilar { padding-inline: 16px; }
  }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-kayan-perde :is(.modulex-kayan-perde-baslik, .modulex-kayan-perde-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-kayan-perde-baslik { line-height: 1.35; }
  @media (max-width: 768px) {
    .modulex-kayan-perde { padding-inline: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-kayan-perde *, .modulex-kayan-perde *::before, .modulex-kayan-perde *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-kayan-perde";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const kayan = (s, P, az) => {
          const k = s.querySelector("." + P + "-karusel");
          if (!k) return;
          const sl = [...k.querySelectorAll("." + P + "-slayt")];
          const nk = [...k.querySelectorAll("." + P + "-nokta")];
          const oy = k.querySelector("." + P + "-oynat");
          const du = k.querySelector("." + P + "-durum");
          const n = sl.length;
          if (n < 2) return;
          s.classList.add(P + "--js");
          let sure = Number(k.dataset.sure);
          if (!Number.isFinite(sure)) sure = 6000;
          sure = Math.min(20000, Math.max(3000, sure));
          let oto = k.dataset.oto !== "0" && !az;
          let aktif = 0;
          let zam = null;
          let bekle = false;
          const rtl = () => getComputedStyle(k).direction === "rtl";
          const goster = (i, duyur) => {
            i = ((i % n) + n) % n;
            sl.forEach((x, j) => {
              const a = j === i;
              x.classList.toggle(P + "-slayt--aktif", a);
              x.setAttribute("aria-hidden", String(!a));
              x.inert = !a;
            });
            nk.forEach((x, j) => {
              x.classList.toggle(P + "-nokta--aktif", j === i);
              if (j === i) x.setAttribute("aria-current", "true");
              else x.removeAttribute("aria-current");
            });
            k.style.setProperty("--i", String(i));
            aktif = i;
            if (du && duyur) du.textContent = sl[i].getAttribute("aria-label") || "";
          };
          const durdur = () => {
            if (zam) { clearInterval(zam); zam = null; }
            k.classList.remove(P + "--oynuyor");
          };
          const baslat = () => {
            durdur();
            if (!oto || bekle || document.hidden) return;
            void k.offsetWidth;
            k.classList.add(P + "--oynuyor");
            zam = setInterval(() => goster(aktif + 1, false), sure);
          };
          const etiket = () => {
            if (!oy) return;
            oy.setAttribute("aria-label", oto ? (k.dataset.dur || "") : (k.dataset.oyna || ""));
            const ik = oy.querySelector(".material-symbols-outlined");
            if (ik) ik.textContent = oto ? "pause" : "play_arrow";
          };
          const git = (i) => { goster(i, true); baslat(); };
          k.querySelectorAll("[data-kayan]").forEach((b) => b.addEventListener("click", () => git(aktif + (b.dataset.kayan === "geri" ? -1 : 1))));
          nk.forEach((b, j) => b.addEventListener("click", () => git(j)));
          if (oy) oy.addEventListener("click", () => { oto = !oto; etiket(); if (oto) { bekle = false; baslat(); } else durdur(); });
          k.addEventListener("keydown", (e) => {
            const r = rtl();
            if (e.key === "ArrowRight") { e.preventDefault(); git(aktif + (r ? -1 : 1)); }
            else if (e.key === "ArrowLeft") { e.preventDefault(); git(aktif + (r ? 1 : -1)); }
            else if (e.key === "Home") { e.preventDefault(); git(0); }
            else if (e.key === "End") { e.preventDefault(); git(n - 1); }
          });
          k.addEventListener("mouseenter", () => { bekle = true; durdur(); });
          k.addEventListener("mouseleave", () => { bekle = false; baslat(); });
          k.addEventListener("focusin", () => { bekle = true; durdur(); });
          k.addEventListener("focusout", (e) => { if (!k.contains(e.relatedTarget)) { bekle = false; baslat(); } });
          let bx = null;
          k.addEventListener("touchstart", (e) => { bx = e.touches && e.touches[0] ? e.touches[0].clientX : null; }, { passive: true });
          k.addEventListener("touchend", (e) => {
            if (bx === null || !e.changedTouches || !e.changedTouches[0]) return;
            const f = e.changedTouches[0].clientX - bx;
            bx = null;
            if (Math.abs(f) < 40) return;
            git(aktif + ((f < 0) !== rtl() ? 1 : -1));
          }, { passive: true });
          document.addEventListener("visibilitychange", () => { if (document.hidden) durdur(); else baslat(); });
          goster(0, false);
          etiket();
          baslat();
        };
    const perdeEs = (s, P) => {
      const k = s.querySelector("." + P + "-karusel");
      const g = [...s.querySelectorAll("." + P + "-gkat")];
      if (!k || !g.length || !("MutationObserver" in window)) return;
      const es = () => { const i = Number(k.style.getPropertyValue("--i")) || 0; g.forEach((x, j) => x.classList.toggle(P + "-gkat--aktif", j === i)); };
      new MutationObserver(es).observe(k, { attributes: true, attributeFilter: ["style"] });
      es();
    };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      kayan(s, P, az);
      perdeEs(s, P, az);
    });
  })();
</script>
