<style>

  .modulex-ekip-zikzak { box-sizing: border-box; width: 100%; padding: --bosluk-- 20px; background: --bg--; color: --text--; font-size: 1rem; line-height: 1.6; font-family: var(--mx-font-sans, inherit); overflow-wrap: break-word; }
  .modulex-ekip-zikzak *, .modulex-ekip-zikzak *::before, .modulex-ekip-zikzak *::after { box-sizing: border-box; }
  /* ham/css.css «* { font-size: 14px }» kalıtımı keser — modül içinde boyut üstten gelsin (ikon yazı tipi hariç) */
  .modulex-ekip-zikzak :where(*:not(.material-symbols-outlined)) { font-size: inherit; }
  /* aynı «*» kuralı font-weight 400 · line-height 1.2 · font-family de basar — modül içinde kalıtım */
  .modulex-ekip-zikzak :where(*:not(.material-symbols-outlined)) { font-weight: inherit; line-height: inherit; font-family: inherit; }
  .modulex-ekip-zikzak :where(h2, h3, h4, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; }
  .modulex-ekip-zikzak :where(ul, ol) { padding: 0; list-style: none; }
  .modulex-ekip-zikzak img { display: block; max-width: 100%; }
  /* <img width height> öznitelik yüksekliği CSS aspect-ratio'yu ezer — sıfır özgüllükle auto (modül sınıfının height'ı yine kazanır) */
  :where(.modulex-ekip-zikzak) img { height: auto; }
  .modulex-ekip-zikzak [hidden] { display: none !important; }
  .modulex-ekip-zikzak :where(a, button, summary, [data-cevir]) { cursor: pointer; }
  .modulex-ekip-zikzak :where(a, button, summary, [tabindex]):focus-visible { outline: 3px solid --accent--; outline-offset: 3px; }
  .modulex-ekip-zikzak-ic { max-width: --max--; margin-inline: auto; }
  .modulex-ekip-zikzak-bas { display: grid; gap: 12px; margin-block-end: clamp(32px, 4vw, 52px); }

  .modulex-ekip-zikzak-baslik { font-family: var(--mx-font-heading, inherit); font-size: clamp(1.8rem, 3.4vw, 2.8rem); font-weight: 750; letter-spacing: -0.025em; line-height: 1.1; }
  .modulex-ekip-zikzak-metin { color: --muted--; font-size: 1.05rem; line-height: 1.7; }
  .modulex-ekip-zikzak-bas { max-width: 780px; margin-inline: auto; text-align: center; justify-items: center; }
  .modulex-ekip-zikzak-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-block-start: 8px; }
  .modulex-ekip-zikzak-dugme { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 12px 22px; border: 2px solid --accent--; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease; }
  .modulex-ekip-zikzak-dugme:hover { transform: translateY(-2px); }
  .modulex-ekip-zikzak-dugme--ikincil { background: transparent; color: --text--; border-color: --cizgi--; }
  .modulex-ekip-zikzak-dugme--ikincil:hover { border-color: --accent--; }
  .modulex-ekip-zikzak-dugme .material-symbols-outlined { font-size: 20px; }

  .modulex-ekip-zikzak-liste { display: grid; gap: clamp(40px, 6vw, 80px); }
  .modulex-ekip-zikzak-satir { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: clamp(24px, 5vw, 72px); align-items: center; transition: opacity 0.7s ease, transform 0.7s ease; }
  .modulex-ekip-zikzak--hazir:not(.modulex-ekip-zikzak--gor) .modulex-ekip-zikzak-satir { opacity: 0; transform: translateY(24px); }
  .modulex-ekip-zikzak-satir:nth-child(even) .modulex-ekip-zikzak-foto { grid-column: 2; grid-row: 1; }
  .modulex-ekip-zikzak-satir:nth-child(even) .modulex-ekip-zikzak-yazi { grid-column: 1; grid-row: 1; }
  .modulex-ekip-zikzak-foto { width: 100%; aspect-ratio: 5 / 4; border-radius: --yuvarlak--; object-fit: cover; font-size: 4rem; }
  .modulex-ekip-zikzak-yazi { display: grid; align-content: center; gap: 10px; }
  .modulex-ekip-zikzak-no { color: --accentInk--; font-size: clamp(2.4rem, 4vw, 3.4rem); font-weight: 800; letter-spacing: -0.04em; line-height: 1; }
  .modulex-ekip-zikzak-ad { font-size: clamp(1.5rem, 2.6vw, 2rem); }
  .modulex-ekip-zikzak-bio { font-size: 1.02rem; }
  @media (max-width: 768px) {
    .modulex-ekip-zikzak-satir { grid-template-columns: minmax(0, 1fr); gap: 18px; }
    .modulex-ekip-zikzak-satir:nth-child(even) .modulex-ekip-zikzak-foto, .modulex-ekip-zikzak-satir:nth-child(even) .modulex-ekip-zikzak-yazi { grid-column: 1; grid-row: auto; }
  }
  /* img width/height öznitelikleri CSS yüksekliği olur — aspect-ratio'nun çalışması için yükseklik auto (modül kuralı ezebilir) */
  :where(.modulex-ekip-zikzak) img { height: auto; }
  .modulex-ekip-zikzak-foto { min-width: 0; }
  .modulex-ekip-zikzak-bag { color: inherit; text-decoration: none; }
  .modulex-ekip-zikzak-bag:hover { text-decoration: underline; text-underline-offset: 4px; }
  .modulex-ekip-zikzak-harf { display: grid; place-items: center; background-color: --vurguBg--; color: --vurguText--; font-weight: 800; letter-spacing: 0.02em; }
  .modulex-ekip-zikzak-sosyal { display: flex; flex-wrap: wrap; gap: 8px; }
  .modulex-ekip-zikzak-slink { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-width: 40px; min-height: 40px; padding: 0 10px; border: 1px solid --cizgi--; border-radius: 999px; color: inherit; font-size: 0.88rem; text-decoration: none; transition: background-color 0.25s ease, color 0.25s ease, border-color 0.25s ease; }
  .modulex-ekip-zikzak-slink:hover { background-color: --accent--; border-color: --accent--; color: --accentText--; }
  .modulex-ekip-zikzak-slink .material-symbols-outlined { font-size: 19px; }
  .modulex-ekip-zikzak-syazi { overflow-wrap: anywhere; }
  .modulex-ekip-zikzak-ad { font-size: 1.12rem; font-weight: 750; line-height: 1.3; }
  .modulex-ekip-zikzak-unvan { color: --accentInk--; font-size: 0.92rem; font-weight: 650; }
  .modulex-ekip-zikzak-bio { color: --muted--; font-size: 0.95rem; line-height: 1.65; }
  .modulex-ekip-zikzak-bolum { color: --muted--; font-size: 0.78rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-ekip-zikzak :is(.modulex-ekip-zikzak-baslik, .modulex-ekip-zikzak-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-ekip-zikzak-baslik { line-height: 1.35; }
  @media (max-width: 768px) {
    .modulex-ekip-zikzak { padding-inline: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-ekip-zikzak *, .modulex-ekip-zikzak *::before, .modulex-ekip-zikzak *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-ekip-zikzak";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const gozlem = (s, P, az) => {
        const gor = () => s.classList.add(P + "--gor");
        s.classList.add(P + "--hazir");
        if (az || !("IntersectionObserver" in window)) { gor(); return; }
        const io = new IntersectionObserver((gs) => {
          gs.forEach((g) => { if (g.isIntersecting) { gor(); io.disconnect(); } });
        }, { threshold: 0.15 });
        io.observe(s);
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      gozlem(s, P, az);
    });
  })();
</script>
