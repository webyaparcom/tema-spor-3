  .modulex-surec-ilerleme-cizgi *, .modulex-surec-ilerleme-cizgi *::before, .modulex-surec-ilerleme-cizgi *::after { box-sizing: border-box; }
  /* ham/css.css «* { font-size: 14px }» kalıtımı keser — modül içinde boyut üstten gelsin (ikon yazı tipi hariç) */

  /* aynı «*» kuralı font-weight 400 · line-height 1.2 · font-family de basar — modül içinde kalıtım */
  .modulex-surec-ilerleme-cizgi :where(*:not(.material-symbols-outlined)) { font-weight: inherit; line-height: inherit; font-family: inherit; }
  .modulex-surec-ilerleme-cizgi :where(h2, h3, h4, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; }
  .modulex-surec-ilerleme-cizgi :where(ul, ol) { padding: 0; list-style: none; }
  .modulex-surec-ilerleme-cizgi img { display: block; max-width: 100%; }

  :where(.modulex-surec-ilerleme-cizgi) img { height: auto; }
  .modulex-surec-ilerleme-cizgi [hidden] { display: none !important; }
  .modulex-surec-ilerleme-cizgi :where(a, button, summary, [data-cevir]) { cursor: pointer; }
  .modulex-surec-ilerleme-cizgi :where(a, button, summary, [tabindex]):focus-visible { outline: 3px solid --accent--; outline-offset: 3px; }
  .modulex-surec-ilerleme-cizgi-ic { max-width: --max--; margin-inline: auto; }

  .modulex-surec-ilerleme-cizgi-metin { color: --muted--; font-size: 1.05rem; line-height: 1.7; }
  .modulex-surec-ilerleme-cizgi-bas { max-width: 780px; margin-inline: auto; text-align: center; justify-items: center; }
  .modulex-surec-ilerleme-cizgi-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-block-start: 8px; }
  .modulex-surec-ilerleme-cizgi-dugme { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 12px 22px; border: 2px solid --accent--; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease; }
  .modulex-surec-ilerleme-cizgi-dugme:hover { transform: translateY(-2px); }
  .modulex-surec-ilerleme-cizgi-dugme--ikincil { background: transparent; color: --text--; border-color: --cizgi--; }

  .modulex-surec-ilerleme-cizgi-akis { position: relative; }
  .modulex-surec-ilerleme-cizgi-hat { position: absolute; inset-block: 0; inset-inline-start: 50%; width: 4px; margin-inline-start: -2px; overflow: hidden; border-radius: 4px; background: --cizgi--; }
  .modulex-surec-ilerleme-cizgi-dolgu { display: block; width: 100%; height: calc(var(--ilerleme, 1) * 100%); background: --accent--; transition: height 0.2s linear; }
  .modulex-surec-ilerleme-cizgi-liste { position: relative; display: grid; gap: 28px; }
  .modulex-surec-ilerleme-cizgi-adim { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) 72px minmax(0, 1fr); align-items: center; }
  .modulex-surec-ilerleme-cizgi-nokta { grid-column: 2; grid-row: 1; justify-self: center; z-index: 1; display: grid; place-items: center; width: 52px; height: 52px; border: 3px solid --accent--; border-radius: 50%; background: --bg--; color: --accentInk--; font-weight: 800; font-variant-numeric: tabular-nums; transition: background 0.3s ease, color 0.3s ease; }
  .modulex-surec-ilerleme-cizgi-adim:hover .modulex-surec-ilerleme-cizgi-nokta { background: --accent--; color: --accentText--; }
  .modulex-surec-ilerleme-cizgi-kutu { position: relative; grid-column: 1; grid-row: 1; display: grid; gap: 8px; padding: 22px 24px; border-radius: --yuvarlak--; background: --kartBg--; text-align: end; }
  .modulex-surec-ilerleme-cizgi-kutu .modulex-surec-ilerleme-cizgi-sure { justify-self: end; }
  .modulex-surec-ilerleme-cizgi-adim:nth-child(even) .modulex-surec-ilerleme-cizgi-kutu { grid-column: 3; text-align: start; }
  .modulex-surec-ilerleme-cizgi-adim:nth-child(even) .modulex-surec-ilerleme-cizgi-sure { justify-self: start; }
  .modulex-surec-ilerleme-cizgi-kbaslik { font-size: 1.15rem; font-weight: 750; }
  .modulex-surec-ilerleme-cizgi-kmetin { color: --muted--; font-size: 0.95rem; }
  @media (max-width: 768px) {
    .modulex-surec-ilerleme-cizgi-hat { inset-inline-start: 26px; }
    .modulex-surec-ilerleme-cizgi-adim { grid-template-columns: 52px minmax(0, 1fr); gap: 14px; }
    .modulex-surec-ilerleme-cizgi-nokta { grid-column: 1; }
    .modulex-surec-ilerleme-cizgi-kutu, .modulex-surec-ilerleme-cizgi-adim:nth-child(even) .modulex-surec-ilerleme-cizgi-kutu { grid-column: 2; text-align: start; }
    .modulex-surec-ilerleme-cizgi-kutu .modulex-surec-ilerleme-cizgi-sure { justify-self: start; }
  }
  .modulex-surec-ilerleme-cizgi-sure { display: inline-flex; align-items: center; gap: 6px; justify-self: start; width: fit-content; padding: 4px 12px; border-radius: 999px; background: color-mix(in srgb, --accent-- 12%, transparent); color: --text--; font-size: 0.85rem; font-weight: 600; }
  .modulex-surec-ilerleme-cizgi-sure .material-symbols-outlined { font-size: 18px; color: --accentInk--; }
  .modulex-surec-ilerleme-cizgi-etiket { color: --accentInk--; font-size: 0.78rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; }

  .modulex-surec-ilerleme-cizgi-bag { color: inherit; text-decoration: none; }
  .modulex-surec-ilerleme-cizgi-bag::after { content: ""; position: absolute; inset: 0; z-index: 3; }
  .modulex-surec-ilerleme-cizgi-bag:hover { text-decoration: underline; text-underline-offset: 4px; }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-surec-ilerleme-cizgi :is(.modulex-surec-ilerleme-cizgi-baslik, .modulex-surec-ilerleme-cizgi-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-surec-ilerleme-cizgi-baslik { line-height: 1.35; }
  @media (max-width: 768px) {
    .modulex-surec-ilerleme-cizgi { padding-inline: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-surec-ilerleme-cizgi *, .modulex-surec-ilerleme-cizgi *::before, .modulex-surec-ilerleme-cizgi *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-surec-ilerleme-cizgi";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const ilerleme = (s, P, az) => {
        if (az) { s.style.setProperty("--ilerleme", "1"); return; }
        let bekle = false;
        const hesap = () => {
          bekle = false;
          const r = s.getBoundingClientRect();
          const h = window.innerHeight || 1;
          const v = Math.min(1, Math.max(0, (h * 0.7 - r.top) / (r.height || 1)));
          s.style.setProperty("--ilerleme", v.toFixed(3));
        };
        window.addEventListener("scroll", () => { if (!bekle) { bekle = true; requestAnimationFrame(hesap); } }, { passive: true });
        hesap();
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      ilerleme(s, P, az);
    });
  })();
</script>
