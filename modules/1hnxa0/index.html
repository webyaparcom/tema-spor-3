<section class="modulex-hizmet-ray-gorsel{{fbsinif}}" {{fbetiket}}>
  <div class="modulex-hizmet-ray-gorsel-ic">
    {{fbbas}}
    {{fbgovde}}
  </div>
</section>

<style>
  /* hizmet-ray-gorsel — Görsel ağırlıklı (portre kartlar) ve yatay kaydırmalı; çok hizmetli siteler tek satırda kalır. */
  .modulex-hizmet-ray-gorsel { box-sizing: border-box; width: 100%; padding: --bosluk-- 20px; background: --bg--; color: --text--; font-size: 1rem; line-height: 1.6; font-family: var(--mx-font-sans, inherit); overflow-wrap: break-word; }
  .modulex-hizmet-ray-gorsel *, .modulex-hizmet-ray-gorsel *::before, .modulex-hizmet-ray-gorsel *::after { box-sizing: border-box; }
  /* ham/css.css «* { font-size: 14px }» kalıtımı keser — modül içinde boyut üstten gelsin (ikon yazı tipi hariç) */
  .modulex-hizmet-ray-gorsel :where(*:not(.material-symbols-outlined)) { font-size: inherit; }
  /* aynı «*» kuralı font-weight 400 · line-height 1.2 · font-family de basar — modül içinde kalıtım */
  .modulex-hizmet-ray-gorsel :where(*:not(.material-symbols-outlined)) { font-weight: inherit; line-height: inherit; font-family: inherit; }
  .modulex-hizmet-ray-gorsel :where(h2, h3, h4, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; }
  .modulex-hizmet-ray-gorsel :where(ul, ol) { padding: 0; list-style: none; }
  .modulex-hizmet-ray-gorsel img { display: block; max-width: 100%; }
  /* <img width height> öznitelik yüksekliği CSS aspect-ratio'yu ezer — sıfır özgüllükle auto (modül sınıfının height'ı yine kazanır) */
  :where(.modulex-hizmet-ray-gorsel) img { height: auto; }
  .modulex-hizmet-ray-gorsel [hidden] { display: none !important; }
  .modulex-hizmet-ray-gorsel :where(a, button, summary, [data-cevir]) { cursor: pointer; }
  .modulex-hizmet-ray-gorsel :where(a, button, summary, [tabindex]):focus-visible { outline: 3px solid --accent--; outline-offset: 3px; }
  .modulex-hizmet-ray-gorsel-ic { max-width: --max--; margin-inline: auto; }
  .modulex-hizmet-ray-gorsel-bas { display: grid; gap: 12px; margin-block-end: clamp(32px, 4vw, 52px); }
  .modulex-hizmet-ray-gorsel--bassiz .modulex-hizmet-ray-gorsel-bas { display: none; }
  .modulex-hizmet-ray-gorsel-ust { color: --accentInk--; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
  .modulex-hizmet-ray-gorsel-baslik { font-family: var(--mx-font-heading, inherit); font-size: clamp(1.8rem, 3.4vw, 2.8rem); font-weight: 750; letter-spacing: -0.025em; line-height: 1.1; }
  .modulex-hizmet-ray-gorsel-metin { color: --muted--; font-size: 1.05rem; line-height: 1.7; }
  .modulex-hizmet-ray-gorsel-bas { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px 48px; align-items: end; }
  .modulex-hizmet-ray-gorsel-ust { grid-column: 1 / -1; }
  .modulex-hizmet-ray-gorsel-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-block-start: 8px; }
  .modulex-hizmet-ray-gorsel-dugme { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 12px 22px; border: 2px solid --accent--; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease; }
  .modulex-hizmet-ray-gorsel-dugme:hover { transform: translateY(-2px); }
  .modulex-hizmet-ray-gorsel-dugme--ikincil { background: transparent; color: --text--; border-color: --cizgi--; }
  .modulex-hizmet-ray-gorsel-dugme--ikincil:hover { border-color: --accent--; }
  .modulex-hizmet-ray-gorsel-dugme .material-symbols-outlined { font-size: 20px; }

  .modulex-hizmet-ray-gorsel-ray { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(260px, 320px); gap: 20px; padding-block-end: 6px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
  .modulex-hizmet-ray-gorsel-ray::-webkit-scrollbar { display: none; }
  .modulex-hizmet-ray-gorsel-kart { display: grid; grid-template-rows: auto 1fr; scroll-snap-align: start; }
  .modulex-hizmet-ray-gorsel-pencere { display: grid; aspect-ratio: 4 / 5; overflow: hidden; border-radius: --yuvarlak--; background: color-mix(in srgb, --accent-- 18%, --bg--); }
  .modulex-hizmet-ray-gorsel-gorsel { width: 100%; height: 100%; object-fit: cover; transition: transform 0.6s ease; }
  .modulex-hizmet-ray-gorsel-kart:hover .modulex-hizmet-ray-gorsel-gorsel { transform: scale(1.05); }
  .modulex-hizmet-ray-gorsel-yer { place-self: center; color: --accentInk--; font-size: 64px; }
  .modulex-hizmet-ray-gorsel-panel { position: relative; z-index: 1; display: grid; align-content: start; gap: 10px; margin: -56px 14px 0; padding: 20px; border-radius: calc(--yuvarlak-- * 0.8); background: --bg--; box-shadow: 0 18px 36px -26px color-mix(in srgb, --text-- 60%, transparent); }
  .modulex-hizmet-ray-gorsel-kbaslik { font-size: 1.15rem; font-weight: 750; }
  .modulex-hizmet-ray-gorsel-kmetin { color: --muted--; font-size: 0.93rem; }
  .modulex-hizmet-ray-gorsel-kontrol { display: flex; justify-content: flex-end; gap: 10px; margin-block-start: 18px; }
  .modulex-hizmet-ray-gorsel-okd { display: inline-grid; place-items: center; width: 48px; height: 48px; border: 1px solid --cizgi--; border-radius: 50%; background: transparent; color: --text--; transition: background 0.25s ease, opacity 0.25s ease; }
  .modulex-hizmet-ray-gorsel-okd:hover:not(:disabled) { background: --accent--; color: --accentText--; }
  .modulex-hizmet-ray-gorsel-okd:disabled { opacity: 0.35; cursor: default; }
  @media (max-width: 768px) {
    .modulex-hizmet-ray-gorsel-ray { grid-auto-columns: 80%; }
  }
  .modulex-hizmet-ray-gorsel-git { position: relative; display: inline-flex; align-items: center; gap: 6px; width: fit-content; color: --accentInk--; font-weight: 700; text-decoration: none; transition: gap 0.25s ease; }
  .modulex-hizmet-ray-gorsel-git:hover { gap: 10px; }
  .modulex-hizmet-ray-gorsel-git .material-symbols-outlined { font-size: 18px; }
  .modulex-hizmet-ray-gorsel-maddeler { display: grid; gap: 6px; }
  .modulex-hizmet-ray-gorsel-maddeler li { display: flex; align-items: flex-start; gap: 8px; font-size: 0.93rem; }
  .modulex-hizmet-ray-gorsel-maddeler .material-symbols-outlined { flex: none; margin-block-start: 1px; color: --accentInk--; font-size: 18px; }
  .modulex-hizmet-ray-gorsel-fiyat { color: --accentInk--; font-weight: 800; }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-hizmet-ray-gorsel :is(.modulex-hizmet-ray-gorsel-baslik, .modulex-hizmet-ray-gorsel-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-hizmet-ray-gorsel-baslik { line-height: 1.35; }
  @media (max-width: 1024px) {
    .modulex-hizmet-ray-gorsel-bas { grid-template-columns: minmax(0, 1fr); }
  }
  @media (max-width: 768px) {
    .modulex-hizmet-ray-gorsel { padding-inline: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-hizmet-ray-gorsel *, .modulex-hizmet-ray-gorsel *::before, .modulex-hizmet-ray-gorsel *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-hizmet-ray-gorsel";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const ray = (s, P) => {
        const ray = s.querySelector("." + P + "-ray");
        if (!ray) return;
        const dugme = [...s.querySelectorAll("[data-ray]")];
        const durum = () => {
          const max = ray.scrollWidth - ray.clientWidth - 2;
          const x = Math.abs(ray.scrollLeft);
          dugme.forEach((b) => { b.disabled = max <= 0 || (b.dataset.ray === "geri" ? x <= 2 : x >= max); });
        };
        dugme.forEach((b) => b.addEventListener("click", () => {
          const ilk = ray.firstElementChild;
          const adim = (ilk ? ilk.getBoundingClientRect().width : ray.clientWidth * 0.8) + 16;
          const rtl = getComputedStyle(ray).direction === "rtl";
          ray.scrollBy({ left: (b.dataset.ray === "ileri" ? 1 : -1) * (rtl ? -1 : 1) * adim, behavior: "smooth" });
        }));
        ray.addEventListener("scroll", durum, { passive: true });
        durum();
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      ray(s, P, az);
    });
  })();
</script>
