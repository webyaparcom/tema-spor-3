<style>
  /* sayac-merdiven — Yerleşimin kendisi bir anlatı kurar (yükselen merdiven); kartlar aynı hizada değil, kademeli. */
  .modulex-sayac-merdiven { box-sizing: border-box; width: 100%; padding: --bosluk-- 20px; background: --bg--; color: --text--; font-size: 1rem; line-height: 1.6; font-family: var(--mx-font-sans, inherit); overflow-wrap: break-word; }
  .modulex-sayac-merdiven *, .modulex-sayac-merdiven *::before, .modulex-sayac-merdiven *::after { box-sizing: border-box; }
  /* ham/css.css «* { font-size: 14px }» kalıtımı keser — modül içinde boyut üstten gelsin (ikon yazı tipi hariç) */
  .modulex-sayac-merdiven :where(*:not(.material-symbols-outlined)) { font-size: inherit; }
  /* aynı «*» kuralı font-weight 400 · line-height 1.2 · font-family de basar — modül içinde kalıtım */
  .modulex-sayac-merdiven :where(*:not(.material-symbols-outlined)) { font-weight: inherit; line-height: inherit; font-family: inherit; }
  .modulex-sayac-merdiven :where(h2, h3, h4, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; }
  .modulex-sayac-merdiven :where(ul, ol) { padding: 0; list-style: none; }
  .modulex-sayac-merdiven img { display: block; max-width: 100%; }
  /* <img width height> öznitelik yüksekliği CSS aspect-ratio'yu ezer — sıfır özgüllükle auto (modül sınıfının height'ı yine kazanır) */
  :where(.modulex-sayac-merdiven) img { height: auto; }
  .modulex-sayac-merdiven [hidden] { display: none !important; }
  .modulex-sayac-merdiven :where(a, button, summary, [data-cevir]) { cursor: pointer; }
  .modulex-sayac-merdiven :where(a, button, summary, [tabindex]):focus-visible { outline: 3px solid --accent--; outline-offset: 3px; }
  .modulex-sayac-merdiven-ic { max-width: --max--; margin-inline: auto; }
  .modulex-sayac-merdiven-bas { display: grid; gap: 12px; margin-block-end: clamp(32px, 4vw, 52px); }
  .modulex-sayac-merdiven--bassiz .modulex-sayac-merdiven-bas { display: none; }
  .modulex-sayac-merdiven-ust { color: --accentInk--; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
  .modulex-sayac-merdiven-baslik { font-family: var(--mx-font-heading, inherit); font-size: clamp(1.8rem, 3.4vw, 2.8rem); font-weight: 750; letter-spacing: -0.025em; line-height: 1.1; }
  .modulex-sayac-merdiven-metin { color: --muted--; font-size: 1.05rem; line-height: 1.7; }
  .modulex-sayac-merdiven-bas { max-width: 760px; }
  .modulex-sayac-merdiven-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-block-start: 8px; }
  .modulex-sayac-merdiven-dugme { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 12px 22px; border: 2px solid --accent--; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease; }
  .modulex-sayac-merdiven-dugme:hover { transform: translateY(-2px); }
  .modulex-sayac-merdiven-dugme--ikincil { background: transparent; color: --text--; border-color: --cizgi--; }
  .modulex-sayac-merdiven-dugme--ikincil:hover { border-color: --accent--; }
  .modulex-sayac-merdiven-dugme .material-symbols-outlined { font-size: 20px; }

  .modulex-sayac-merdiven-merdiven { position: relative; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); align-items: end; gap: 16px; min-height: 420px; }
  .modulex-sayac-merdiven-merdiven::before { content: ""; position: absolute; inset-inline: 4% 4%; inset-block-end: 16px; height: 2px; border-block-start: 2px dashed --cizgi--; transform: rotate(-8deg); transform-origin: center; }
  [dir="rtl"] .modulex-sayac-merdiven-merdiven::before { transform: rotate(8deg); }
  .modulex-sayac-merdiven-basamak { position: relative; padding-block-end: calc(var(--k) * 200px); transition: padding 1s cubic-bezier(0.2, 0.8, 0.2, 1); }
  .modulex-sayac-merdiven--hazir:not(.modulex-sayac-merdiven--gor) .modulex-sayac-merdiven-basamak { padding-block-end: 0; }
  .modulex-sayac-merdiven-kart { display: grid; gap: 6px; padding: 24px; border-radius: --yuvarlak--; background: --kartBg--; border: 1px solid --cizgi--; transition: background 0.3s ease, color 0.3s ease, transform 0.3s ease; }
  .modulex-sayac-merdiven-basamak:last-child .modulex-sayac-merdiven-kart { background: --vurguBg--; color: --vurguText--; border-color: transparent; }
  .modulex-sayac-merdiven-basamak:last-child .modulex-sayac-merdiven-ikon, .modulex-sayac-merdiven-basamak:last-child .modulex-sayac-merdiven-ek, .modulex-sayac-merdiven-basamak:last-child .modulex-sayac-merdiven-not { color: inherit; }
  .modulex-sayac-merdiven-kart:hover { transform: translateY(-6px); }
  .modulex-sayac-merdiven-ikon { color: --accentInk--; font-size: 28px; }
  .modulex-sayac-merdiven-sayi { font-size: clamp(2rem, 3.4vw, 2.7rem); font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  .modulex-sayac-merdiven-ek { color: --accentInk--; font-size: 0.55em; }
  .modulex-sayac-merdiven-etiket { font-size: 1rem; font-weight: 700; }
  .modulex-sayac-merdiven-not { color: --muted--; font-size: 0.88rem; }
  @media (max-width: 768px) {
    .modulex-sayac-merdiven-merdiven { grid-auto-flow: row; min-height: 0; gap: 12px; }
    .modulex-sayac-merdiven-merdiven::before { display: none; }
    .modulex-sayac-merdiven-basamak { padding-block-end: 0; padding-inline-start: calc(var(--k) * 48px); }
  }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-sayac-merdiven :is(.modulex-sayac-merdiven-baslik, .modulex-sayac-merdiven-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-sayac-merdiven-baslik { line-height: 1.35; }
  @media (max-width: 768px) {
    .modulex-sayac-merdiven { padding-inline: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-sayac-merdiven *, .modulex-sayac-merdiven *::before, .modulex-sayac-merdiven *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-sayac-merdiven";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const gozlem = (s, P, az) => {
        const gor = () => s.classList.add(P + "--gor");
        s.classList.add(P + "--hazir");
        if (az || !("IntersectionObserver" in window)) { gor(); return; }
        const io = new IntersectionObserver((gs) => {
          gs.forEach((g) => { if (g.isIntersecting) { gor(); io.disconnect(); } });
        }, { threshold: 0.15 });
        io.observe(s);
      };
    const sayac = (s, P, az) => {
        const el = [...s.querySelectorAll("[data-hedef]")];
        if (!el.length || az || !("IntersectionObserver" in window)) return;
        const dl = document.documentElement.lang || undefined;
        const oynat = () => el.forEach((e) => {
          const h = Number(e.dataset.hedef);
          const od = Number(e.dataset.ondalik) || 0;
          const son = e.textContent;
          if (!Number.isFinite(h)) return;
          let f;
          try { f = new Intl.NumberFormat(dl, { minimumFractionDigits: od, maximumFractionDigits: od }); } catch (x) { return; }
          const t0 = performance.now();
          const adim = (t) => {
            const p = Math.min(1, (t - t0) / 1300);
            e.textContent = p < 1 ? f.format(h * (1 - Math.pow(1 - p, 3))) : son;
            if (p < 1) requestAnimationFrame(adim);
          };
          requestAnimationFrame(adim);
        });
        const io = new IntersectionObserver((gs) => {
          gs.forEach((g) => { if (g.isIntersecting) { oynat(); io.disconnect(); } });
        }, { threshold: 0.3 });
        io.observe(s);
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      gozlem(s, P, az);
      sayac(s, P, az);
    });
  })();
</script>
